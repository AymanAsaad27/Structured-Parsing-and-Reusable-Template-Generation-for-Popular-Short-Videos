[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-video-templates"
version = "0.1.0"
description = "Structured parsing and reusable editing templates for beauty short videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/AymanAsaad27/Structured-Parsing-and-Reusable-Template-Generation-for-Popular-Short-Videos"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
reporting = ["reportlab>=4,<5"]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "Pillow>=10,<14", "av>=14,<20", "opencv-python>=4.10,<6", "imageio-ffmpeg>=0.6,<1", "scenedetect[opencv]>=0.6,<0.7"]
generation = ["requests>=2.32,<3", "Pillow>=10,<14", "av>=14,<20", "imageio-ffmpeg>=0.6,<1"]
shots = ["scenedetect[opencv]>=0.6,<0.7", "av>=14,<20"]
beats = ["librosa>=0.10,<2", "soundfile>=0.12,<1", "imageio-ffmpeg>=0.6,<1", "opencv-python>=4.10,<6"]
asr = ["faster-whisper>=1,<2", "soundfile>=0.12,<1", "imageio-ffmpeg>=0.6,<1", "opencv-python>=4.10,<6"]
ocr = ["easyocr>=1.7,<2", "av>=14,<20"]
vision = ["torch>=2.6", "torchvision>=0.21", "transformers>=4.50,<5", "av>=14,<20", "opencv-python>=4.10,<6"]
beat-model = ["beat-this>=1.1,<2", "torchaudio>=2"]
phase2 = ["scenedetect[opencv]>=0.6,<0.7", "librosa>=0.10,<2", "soundfile>=0.12,<1", "imageio-ffmpeg>=0.6,<1", "faster-whisper>=1,<2", "easyocr>=1.7,<2", "transformers>=4.50,<5", "torch>=2.6", "torchvision>=0.21", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4"]

[project.scripts]
bvt = "beauty_video_templates.cli:main"
bvt-parse = "beauty_video_templates.parsing.runner:main"
bvt-evaluate = "beauty_video_templates.evaluation.runner:main"
bvt-studio = "beauty_video_templates.demo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beauty_video_templates = ["schemas/*.json"]
"beauty_video_templates.demo" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
